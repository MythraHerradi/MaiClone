<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaiClone</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        color: #ecebe6; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(900px 500px at 50% 0%, #3a2433 0%, #14161a 65%);
      }
      main { text-align: center; max-width: 560px; }
      .mark { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; background: #e95d3f; color: #fff; font-size: 26px; font-weight: 800; }
      h1 { margin: 22px 0 10px; font-size: clamp(44px, 9vw, 84px); letter-spacing: -0.05em; line-height: 1; }
      p { margin: 0 0 36px; color: #9a9ca3; }
      .actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
      a.btn { padding: 15px 26px; border-radius: 14px; text-decoration: none; font-weight: 700; border: 1px solid #353a43; color: #ecebe6; background: #1b1e24; transition: transform .15s, background .15s; }
      a.btn:hover { transform: translateY(-2px); background: #23272f; }
      a.btn.primary { background: #e95d3f; border-color: transparent; color: #fff; }
      a.btn.primary:hover { background: #f06a4c; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark">M</span>
      <h1>MaiClone</h1>
      <p>Choisis la version à ouvrir.</p>
      <div class="actions">
        <a class="btn" href="index0.html">Version 1 (Originale)</a>
        <a class="btn primary" href="index1.html">Version 2 (Chat Interface)</a>
      </div>
    </main>
  </body>
</html>
