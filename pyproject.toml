[project]
name = "maiclone"
version = "0.1.0"
description = "Build a personal chat clone from Instagram archive data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = [
  "accelerate>=0.33.0",
  "datasets>=2.20.0",
  "peft>=0.11.1",
  "torch>=2.3.0",
  "transformers>=4.42.0",
]

[project.scripts]
maiclone = "maiclone.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
