<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaiClone | Signaler une erreur</title>
    <link rel="stylesheet" href="v1/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Accueil MaiClone">
          <span class="brand-mark">M</span>
          <span>MaiClone</span>
        </a>
        <a class="back" href="./">← Retour</a>
      </header>

      <section class="intro">
        <p class="eyebrow">Support</p>
        <h1>Signaler une erreur.</h1>
        <p class="intro-text">Décris ce qui s'est passé. Le rapport est enregistré pour qu'on puisse le corriger.</p>
      </section>

      <form id="report-form" class="report">
        <div class="row">
          <label>Type d'erreur
            <select name="type" id="type">
              <option value="prepare">Préparation des données</option>
              <option value="train">Entraînement</option>
              <option value="server">Serveur injoignable</option>
              <option value="ui">Interface</option>
              <option value="other">Autre</option>
            </select>
          </label>
          <label>Email (optionnel)
            <input name="email" type="email" placeholder="toi@exemple.fr" />
          </label>
        </div>
        <label>Titre
          <input name="title" id="title" placeholder="Ex : l'entraînement s'arrête à l'epoch 1" required />
        </label>
        <label>Détails / trace d'erreur
          <textarea name="details" id="details" rows="8" placeholder="Colle ici le message ou la trace complète" required></textarea>
        </label>
        <p class="meta" id="meta"></p>
        <button class="run-button" id="submit" type="submit">Envoyer le rapport</button>
        <p class="result" id="result" aria-live="polite"></p>
      </form>
    </main>

    <script src="v1/script.js"></script>
  </body>
</html>
